services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${UID}:${GID}"
    container_name: subpay_app
    restart: unless-stopped
    # Runs the web server CMD defined in the Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./app:/var/www/app
    depends_on:
      - postgres
      - redis
    networks:
      - subpay_network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${UID}:${GID}"
    container_name: subpay_queue
    restart: unless-stopped
    # Overrides the web server CMD to run the queue processor specifically
    command: php artisan queue:work redis --queue=billing,default --tries=3 --timeout=90
    volumes:
      - ./app:/var/www/app
    depends_on:
      - postgres
      - redis
    networks:
      - subpay_network

  postgres:
    image: postgres:16-alpine
    container_name: subpay_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: subpay
      POSTGRES_USER: subpay
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - subpay_network

  redis:
    image: redis:7-alpine
    container_name: subpay_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - subpay_network

  # PROMETHEUS SERVICE
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: subpay_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - app
    networks:
      - subpay_network

  # GRAFANA SERVICE
  grafana:
    image: grafana/grafana:10.4.1
    container_name: subpay_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - subpay_network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  subpay_network:
    driver: bridge